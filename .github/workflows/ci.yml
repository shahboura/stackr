name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Unit and golden tests
        run: bun test

      - name: Build static site
        run: bun run build

      - name: Prerendered pages exist
        run: |
          for slug in jellyfin sonarr radarr prowlarr qbittorrent seerr dozzle immich audiobookshelf; do
            test -f "dist/services/$slug.html" || { echo "missing dist/services/$slug.html"; exit 1; }
          done
          test -f dist/sitemap.xml
          test -f dist/robots.txt

      - name: Generated compose is valid
        run: |
          docker compose -f tests/golden/media/compose.yaml --env-file tests/golden/media/.env config -q
          docker compose -f tests/golden/new-services/compose.yaml --env-file tests/golden/new-services/.env config -q

      - name: Golden files are in sync
        run: git diff --exit-code -- tests/golden
