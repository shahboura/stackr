# Generated by stackr. Keep this file next to .env, then run: docker compose up -d
# Values are read from .env in the same folder. Do not commit that file.

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.4ubu2604-ls57
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
    ports:
      - ${JELLYFIN_PORT}:8096
    volumes:
      - ${DATA_DIR}/appdata/jellyfin:/config
      - ${DATA_DIR}/media:/data/media
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
    ports:
      - ${SONARR_PORT}:8989
    volumes:
      - ${DATA_DIR}/appdata/sonarr:/config
      - ${DATA_DIR}:/data
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
    ports:
      - ${RADARR_PORT}:7878
    volumes:
      - ${DATA_DIR}/appdata/radarr:/config
      - ${DATA_DIR}:/data
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
    ports:
      - ${PROWLARR_PORT}:9696
    volumes:
      - ${DATA_DIR}/appdata/prowlarr:/config
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT}
      TORRENTING_PORT: ${QBITTORRENT_TORRENTING_PORT}
    ports:
      - ${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}
      - ${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}
      - ${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/udp
    volumes:
      - ${DATA_DIR}/appdata/qbittorrent:/config
      - ${DATA_DIR}:/data
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.0.1
    restart: unless-stopped
    init: true
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      PORT: 5055
      API_KEY: ${SEERR_API_KEY}
    ports:
      - ${SEERR_PORT}:5055
    volumes:
      - ${DATA_DIR}/appdata/seerr:/app/config
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:5055/api/v1/settings/public
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
  dozzle:
    image: amir20/dozzle:v11.3
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - ${DOZZLE_PORT}:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
