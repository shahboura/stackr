services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
    ports:
      - "${SONARR_PORT}:8989"
    volumes:
      - ${DATA_DIR}/appdata/sonarr:/config
      - ${DATA_DIR}:/data
