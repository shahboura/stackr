services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
    ports:
      - "${RADARR_PORT}:7878"
    volumes:
      - ${DATA_DIR}/appdata/radarr:/config
      - ${DATA_DIR}:/data
