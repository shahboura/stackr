services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    restart: unless-stopped
    user: ${PUID}:${PGID}
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
    ports:
      - "${AUDIOBOOKSHELF_PORT}:80"
    volumes:
      - ${DATA_DIR}/appdata/audiobookshelf/config:/config
      - ${DATA_DIR}/appdata/audiobookshelf/metadata:/metadata
      - ${DATA_DIR}/media/audiobooks:/audiobooks
      - ${DATA_DIR}/media/podcasts:/podcasts
