services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.5
    restart: unless-stopped
    user: ${PUID}:${PGID}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich-db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-valkey
    ports:
      - "${IMMICH_PORT}:2283"
    volumes:
      - ${DATA_DIR}/appdata/immich/library:/data
    depends_on:
      - immich-valkey
      - immich-db

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5
    restart: unless-stopped
    user: ${PUID}:${PGID}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/appdata/immich/cache:/cache
    healthcheck:
      disable: false

  immich-db:
    image: ghcr.io/immich-app/postgres:16-vectorchord0.5.3-pgvector0.8.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    environment:
      TZ: ${TZ}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - immich-pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

  immich-valkey:
    image: valkey/valkey:9.0.7-alpine3.24
    restart: unless-stopped
    user: ${PUID}:${PGID}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/appdata/immich/valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]

volumes:
  immich-pgdata: {}
